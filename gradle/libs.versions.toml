[versions]
kotlin = "2.4.21"
ktor = "3.6.1"
logback = "1.5.38"
enturLogging = "7.1.4"
junit = "6.1.3"
kotest = "6.2.6"
mockk = "1.14.11"
kaml = "0.104.0"
javaJwt = "4.6.2"
bouncycastle = "1.86"
googleGenai = "1.80.0"
javaDiffUtils = "4.16"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core-jvm", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio-jvm", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation-jvm", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock-jvm", version.ref = "ktor" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "javaJwt" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
google-genai = { module = "com.google.genai:google-genai", version.ref = "googleGenai" }
java-diff-utils = { module = "io.github.java-diff-utils:java-diff-utils", version.ref = "javaDiffUtils" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
entur-logback-logstash-encoder-gcp = { module = "no.entur.logging.cloud:logback-logstash-encoder-gcp", version.ref = "enturLogging" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
