---
version: 2
updates:
- package-ecosystem: "gradle"
  directory: /
  groups:
    minor-and-patch:
      applies-to: version-updates
      update-types: ["minor", "patch"]
  schedule:
    interval: "weekly"
    day: "monday"
    time: "09:00"
    timezone: "UTC"
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
- package-ecosystem: "github-actions"
  directories:
  - /.github/workflows
  groups:
    minor-and-patch:
      applies-to: version-updates
      update-types: ["minor", "patch"]
  schedule:
    interval: "weekly"
    day: "monday"
    time: "09:00"
    timezone: "UTC"
  open-pull-requests-limit: 2
  cooldown:
    default-days: 7
- package-ecosystem: "docker"
  directories:
  - /
  groups:
    minor-and-patch:
      applies-to: version-updates
      update-types: ["minor", "patch"]
  schedule:
    interval: "weekly"
    day: "monday"
    time: "09:00"
    timezone: "UTC"
  open-pull-requests-limit: 2
  cooldown:
    default-days: 7
- package-ecosystem: terraform
  directories:
  - /terraform
  schedule:
    interval: "daily"
    time: "09:00"
    timezone: "UTC"
  open-pull-requests-limit: 0  # kun sikkerhetsoppdateringer
